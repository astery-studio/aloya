name: Runtime Audit

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - backend/package.json
      - backend/package-lock.json
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/runtime-audit.yml
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Runtime Audit ${{ matrix.application }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: backend
            audit-level: high
          - application: frontend
            audit-level: critical
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - run: npm ci
      - name: Bloquear vulnerabilidades de runtime não aceitas
        run: npm audit --omit=dev --audit-level=${{ matrix.audit-level }}
