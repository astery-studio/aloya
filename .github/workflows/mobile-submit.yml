name: Mobile Store Submission

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Loja de destino
        required: true
        type: choice
        options: [android, ios]

permissions:
  contents: read

concurrency:
  group: mobile-store-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  submit:
    name: Submit latest production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configurar Expo e EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Enviar o build de produção mais recente
        run: eas submit --platform "${{ inputs.platform }}" --profile production --latest --non-interactive
