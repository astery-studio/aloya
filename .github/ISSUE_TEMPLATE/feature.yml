name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou melhoria técnica.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Qual problema deve ser resolvido e para quem?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
      description: Descreva o comportamento esperado sem incluir dados sensíveis.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] Critério 1
        - [ ] Critério 2
    validations:
      required: true
