name: Relatar um erro
description: Registre um comportamento incorreto ou uma regressão.
title: 'fix: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Não inclua senhas, tokens, dados médicos ou informações pessoais.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir?
      placeholder: |
        1. Acesse...
        2. Toque em...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options: [Frontend, Backend, Banco de dados, CI/CD, Documentação]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informe sistema, dispositivo e versão do aplicativo, quando aplicável.
